name: Desktop Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write
  attestations: write
  id-token: write

jobs:
  native-package:
    name: Build ${{ matrix.name }} package
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows
            os: windows-latest
            command: desktop:package:win
            artifact: PaperSage-Windows
            files: |
              web/release/*.exe
              web/release/*.yml
              web/release/*.blockmap
          - name: macOS
            os: macos-latest
            command: desktop:package:mac
            artifact: PaperSage-macOS
            files: |
              web/release/*.dmg
              web/release/*.zip
              web/release/*.yml
              web/release/*.blockmap
          - name: Linux
            os: ubuntu-latest
            command: desktop:package:linux
            artifact: PaperSage-Linux
            files: |
              web/release/*.AppImage
              web/release/*.deb
              web/release/*.yml
              web/release/*.blockmap
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Install dependencies
        run: |
          uv sync --extra dev --no-install-project
          npm ci --prefix web

      - name: Verify release tag version
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        run: |
          $tagVersion = "${{ github.ref_name }}".Substring(1)
          $webVersion = node -p "require('./web/package.json').version"
          $pythonVersion = uv run python -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])"
          if ($tagVersion -ne $webVersion -or $tagVersion -ne $pythonVersion) {
            throw "Tag v$tagVersion must match web ($webVersion) and Python ($pythonVersion) versions."
          }

      - name: Build installer
        run: |
          npm --prefix web run ${{ matrix.command }}
          npm --prefix web run desktop:checksums
        env:
          CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
          WIN_CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          WIN_CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}

      - name: Attest release packages
        if: github.event.repository.private == false
        uses: actions/attest@v4
        with:
          subject-path: |
            ${{ matrix.files }}
            web/release/SHA256SUMS.txt

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}-${{ github.ref_name }}
          path: |
            ${{ matrix.files }}
            web/release/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14

  publish-release:
    name: Publish GitHub Release
    needs: native-package
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - name: Download release artifacts
        uses: actions/download-artifact@v5
        with:
          path: release
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: release/**/*
