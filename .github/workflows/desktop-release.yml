name: Desktop Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write
  attestations: write
  id-token: write

jobs:
  native-package:
    name: Build ${{ matrix.name }} package
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows
            os: windows-latest
            command: desktop:package:win
            artifact: PaperSage-Windows
            files: |
              web/release/*.exe
              web/release/latest.yml
              web/release/*.blockmap
          - name: macOS
            os: macos-latest
            command: desktop:package:mac
            artifact: PaperSage-macOS
            files: |
              web/release/*.dmg
              web/release/*.zip
              web/release/latest-mac.yml
              web/release/*.blockmap
          - name: Linux
            os: ubuntu-latest
            command: desktop:package:linux
            artifact: PaperSage-Linux
            files: |
              web/release/*.AppImage
              web/release/*.deb
              web/release/latest-linux.yml
              web/release/*.blockmap
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v6.0.10
        with:
          version: 11.18.0
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true
      - name: Cache Electron toolchain
        uses: actions/cache@v6.1.0
        with:
          path: |
            ~/.cache/electron
            ~/.cache/electron-builder
            ~/Library/Caches/electron
            ~/Library/Caches/electron-builder
            ~/AppData/Local/electron/Cache
            ~/AppData/Local/electron-builder/Cache
          key: ${{ runner.os }}-electron-${{ hashFiles('web/pnpm-lock.yaml') }}
          restore-keys: ${{ runner.os }}-electron-

      - name: Install dependencies
        run: |
          uv sync --extra dev --no-install-project
          pnpm --dir web install --frozen-lockfile

      - name: Verify release tag version
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        run: |
          $tagVersion = "${{ github.ref_name }}".Substring(1)
          $webVersion = node -p "require('./web/package.json').version"
          $pythonVersion = uv run python -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])"
          if ($tagVersion -ne $webVersion -or $tagVersion -ne $pythonVersion) {
            throw "Tag v$tagVersion must match web ($webVersion) and Python ($pythonVersion) versions."
          }

      - name: Build installer
        shell: pwsh
        run: |
          if ("${{ matrix.name }}" -eq "macOS") {
            if ($env:MAC_CSC_LINK) {
              $env:CSC_LINK = $env:MAC_CSC_LINK
              $env:CSC_KEY_PASSWORD = $env:MAC_CSC_KEY_PASSWORD
            } else {
              $env:CSC_IDENTITY_AUTO_DISCOVERY = "false"
            }
          }
          pnpm --dir web run ${{ matrix.command }}
          pnpm --dir web run desktop:verify-update-metadata
          pnpm --dir web run desktop:checksums
        env:
          MAC_CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
          MAC_CSC_KEY_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
          WIN_CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          WIN_CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}

      - name: Upload installer artifact
        uses: actions/upload-artifact@v7.0.1
        with:
          # Branch names can contain "/" which artifact names reject; fall
          # back to the run id for workflow_dispatch test builds.
          name: ${{ matrix.artifact }}-${{ github.ref_type == 'tag' && github.ref_name || github.run_id }}
          path: ${{ matrix.files }}
          if-no-files-found: error
          retention-days: 14

  publish-release:
    name: Publish GitHub Release
    needs: native-package
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v6.0.10
        with:
          version: 11.18.0
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true

      - name: Build bundled web application
        run: |
          pnpm --dir web install --frozen-lockfile
          pnpm --dir web run build

      - name: Build Python release artifacts
        run: uv build --out-dir python-dist

      - name: Download release artifacts
        uses: actions/download-artifact@v8.0.1
        with:
          path: release

      - name: Consolidate release assets
        shell: pwsh
        run: |
          $outputDirectory = Join-Path $PWD "release-assets"
          New-Item -ItemType Directory -Path $outputDirectory -Force | Out-Null
          $assets = Get-ChildItem -Path "release", "python-dist" -Recurse -File
          foreach ($asset in $assets) {
            $destination = Join-Path $outputDirectory $asset.Name
            if (Test-Path $destination) {
              throw "Duplicate release asset name: $($asset.Name)"
            }
            Copy-Item -LiteralPath $asset.FullName -Destination $destination
          }
          $checksums = Get-ChildItem -Path $outputDirectory -File |
            Sort-Object Name |
            ForEach-Object {
              $hash = Get-FileHash -LiteralPath $_.FullName -Algorithm SHA256
              "$($hash.Hash.ToLowerInvariant())  $($_.Name)"
            }
          Set-Content -LiteralPath (Join-Path $outputDirectory "SHA256SUMS.txt") -Value $checksums

      - name: Attest consolidated release assets
        if: github.event.repository.private == false
        uses: actions/attest@v4
        with:
          subject-path: release-assets/*

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v3.0.2
        with:
          generate_release_notes: true
          files: release-assets/*

      - name: Publish updater assets to Cloudflare R2
        shell: pwsh
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          R2_ENDPOINT: https://5bf0e92040869b5b56123207a122dc6d.r2.cloudflarestorage.com
          UPDATE_BUCKET: overlink-papersage-desktop-updates-prod
        run: |
          $metadataFiles = @("latest.yml", "latest-mac.yml", "latest-linux.yml")
          $updateFiles = [System.Collections.Generic.HashSet[string]]::new([System.StringComparer]::Ordinal)
          foreach ($metadataFile in $metadataFiles) {
            $metadataPath = Join-Path "release-assets" $metadataFile
            $path = (Select-String -LiteralPath $metadataPath -Pattern '^path:\s*["'']?([^"''\r\n]+)' | Select-Object -First 1).Matches.Groups[1].Value.Trim()
            if (-not $path) { throw "Updater metadata does not declare a path: $metadataFile" }
            $updateFiles.Add($metadataFile) | Out-Null
            $updateFiles.Add($path) | Out-Null
            $blockmapPath = Join-Path "release-assets" "$path.blockmap"
            if (Test-Path $blockmapPath) { $updateFiles.Add("$path.blockmap") | Out-Null }
          }
          foreach ($file in $updateFiles) {
            $localPath = Join-Path "release-assets" $file
            if (-not (Test-Path $localPath)) { throw "Missing updater asset: $file" }
            $cacheControl = if ($file -like "latest*.yml") { "no-store" } else { "public, max-age=31536000, immutable" }
            aws s3 cp $localPath "s3://$env:UPDATE_BUCKET/$file" `
              --endpoint-url $env:R2_ENDPOINT `
              --cache-control $cacheControl `
              --only-show-errors
          }
