<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<title>PaperSage 账户与连接菜单 — v1.4.4 设计稿</title>
</head>
<body style="margin:0;background:#09090b;font-family:'Segoe UI','Microsoft YaHei',system-ui,sans-serif;">
  <div style="display:flex;align-items:flex-start;gap:32px;padding:40px;width:760px;box-sizing:border-box;">

    <!-- 侧边栏底部(改动后:不再有独立"设置"导航项) -->
    <div style="width:232px;flex-shrink:0;">
      <div style="border-top:1px solid #27272a;padding-top:12px;">
        <div style="display:flex;align-items:center;gap:12px;padding:8px;border-radius:8px;background:#18181b;">
          <div style="width:36px;height:36px;border-radius:50%;background:#3f3f46;display:flex;align-items:center;justify-content:center;color:#d4d4d8;font-size:16px;">人</div>
          <div style="flex:1;min-width:0;">
            <div style="color:#fafafa;font-size:14px;font-weight:500;">本地用户</div>
            <div style="color:#a1a1aa;font-size:12px;">本地工作区</div>
          </div>
          <div style="width:10px;height:10px;border-radius:2px;background:#059669;" title="本地模式"></div>
        </div>
      </div>
    </div>

    <!-- 用户区下拉(唯一的设置入口) -->
    <div style="width:256px;flex-shrink:0;background:#18181b;border:1px solid #27272a;border-radius:10px;padding:6px;box-shadow:0 10px 30px rgba(0,0,0,.45);">
      <div style="padding:8px 10px;color:#a1a1aa;font-size:12px;font-weight:500;">账户与连接</div>

      <div style="display:flex;align-items:center;gap:8px;padding:8px 10px;border-radius:6px;background:#26262b;">
        <div style="width:14px;height:14px;border-radius:50%;border:1.5px solid #fafafa;box-shadow:inset 0 0 0 3px #18181b;background:#fafafa;"></div>
        <span style="color:#fafafa;font-size:14px;flex:1;">本地模式</span>
        <span style="background:#3f3f46;color:#d4d4d8;font-size:11px;padding:2px 8px;border-radius:999px;">当前</span>
      </div>

      <div style="display:flex;align-items:center;gap:8px;padding:8px 10px;border-radius:6px;opacity:.45;">
        <div style="width:14px;height:14px;border-radius:50%;border:1.5px solid #71717a;"></div>
        <span style="color:#d4d4d8;font-size:14px;flex:1;">云端模式</span>
        <span style="border:1px solid #3f3f46;color:#a1a1aa;font-size:11px;padding:2px 8px;border-radius:999px;">暂不可用</span>
      </div>

      <div style="padding:8px 10px;color:#71717a;font-size:12px;line-height:1.6;">云端模式将在账号认证与服务兼容性检查完成后开放。</div>

      <div style="border-top:1px solid #27272a;margin:6px 4px;"></div>

      <div style="display:flex;align-items:center;gap:8px;padding:8px 10px;border-radius:6px;background:#05966933;">
        <div style="width:16px;height:16px;color:#fafafa;font-size:13px;display:flex;align-items:center;justify-content:center;">⚙</div>
        <span style="color:#fafafa;font-size:14px;font-weight:500;">设置</span>
        <span style="margin-left:auto;color:#71717a;font-size:11px;">唯一入口</span>
      </div>
    </div>

  </div>
</body>
</html>
